name: ci

# Actions are pinned to a major tag, which floats within that major and is what
# the actions themselves publish for. Pinning an exact tag here buys little —
# the supply-chain answer is a commit SHA, and that is a decision about this
# repository's threat model rather than about staying current.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two runtimes, two jobs. Running them in one would mean a Java change waiting
# on .NET containers to finish, and a failure in either being reported as "ci
# failed" with no clue which half.
jobs:
  dotnet:
    name: .NET — orders and gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from global.json, so CI and a laptop cannot drift.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      # Unit tests and integration tests together. The integration suite starts
      # Postgres and Kafka through Testcontainers; ubuntu-latest ships a running
      # Docker daemon, so nothing needs to be installed for that.
      - name: Test
        run: dotnet test --configuration Release --no-build

  java:
    name: Java — notifications
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

  images:
    name: Images build and scan
    runs-on: ubuntu-latest
    # No point scanning images for a commit whose code does not compile.
    needs: [dotnet, java]
    steps:
      - uses: actions/checkout@v7

      # Builds all three service images exactly as compose does, so a Dockerfile
      # that only works on the author's machine fails here rather than on the
      # first person to clone it.
      - name: Build images
        run: docker compose build

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: polyglot-reference-orders:latest
          format: table
          # Report, do not block. A base image picking up a CVE overnight is not
          # a reason to fail a commit that did not touch it — but it is a reason
          # for whoever reads the log to know.
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
