# One target, not four.
#
# Every service pushes OTLP to the collector, and the collector holds the
# current values for Prometheus to scrape. Scraping each service directly would
# mean each runtime needing its own Prometheus endpoint — an actuator path in
# Spring, and in .NET a package that is still prerelease.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: services
    static_configs:
      - targets: ["otel-collector:8889"]
