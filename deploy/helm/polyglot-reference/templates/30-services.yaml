{{/*
  The three services. Written out rather than looped: they differ in replica
  count, probe path, probe patience and resources, and a template that took all
  of those as parameters would be longer than this and harder to read.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: {{- include "polyglot.labels" (dict "name" "orders" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.orders }}
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      {{- include "polyglot.podDefaults" . | nindent 6 }}
      containers:
        - name: orders
          image: {{ .Values.images.orders | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: orders-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            # Slower to fire than readiness. Taking a pod out of rotation is
            # cheap and reversible; restarting it during a slow moment makes the
            # slow moment worse.
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: { app: orders }
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: {{- include "polyglot.labels" (dict "name" "notifications" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.notifications }}
  selector:
    matchLabels: { app: notifications }
  template:
    metadata:
      labels: { app: notifications }
    spec:
      {{- include "polyglot.podDefaults" . | nindent 6 }}
      containers:
        - name: notifications
          image: {{ .Values.images.notifications | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: notifications-config }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
            # Generous because this endpoint waits on Redis, and Lettuce's
            # command timeout is tens of seconds. docs/adr/0006 records that a
            # probe blocking on the dependency it reports on is the wrong way
            # round, and that it is not fixed.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector: { app: notifications }
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "polyglot.labels" (dict "name" "gateway" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      {{- include "polyglot.podDefaults" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ .Values.images.gateway | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: gateway-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: {{ .Values.gateway.serviceType }}
  selector: { app: gateway }
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: 8080
