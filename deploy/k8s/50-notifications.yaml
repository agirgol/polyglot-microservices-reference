apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: polyglot-reference
spec:
  # One. Two would share a consumer group and split the partitions, which is
  # correct — but there is one partition per topic here, so the second replica
  # would be assigned nothing and sit idle looking healthy. Scaling this means
  # partitioning the topics first. See ADR 0003.
  replicas: 1
  selector:
    matchLabels: { app: notifications }
  template:
    metadata:
      labels: { app: notifications }
    spec:
      # Kubernetes injects an environment variable per Service in the namespace,
      # in the shape REDIS_PORT=tcp://10.96.0.1:6379 — a convention from before
      # cluster DNS existed. Spring reads `spring.data.redis.port` from
      # REDIS_PORT, gets a URL where it wants an int, and refuses to start:
      # "Failed to bind properties under 'spring.data.redis.port' to int".
      #
      # Nothing here discovers services by environment variable. Turning the
      # links off removes the collision and a few dozen variables nobody reads.
      enableServiceLinks: false
      containers:
        - name: notifications
          image: polyglot-reference-notifications:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: notifications-config }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
            # Generous, because the health endpoint waits on Redis and Lettuce's
            # command timeout is measured in seconds. ADR 0006 records that this
            # is the wrong way round — a probe should not block on the thing it
            # is reporting on — and that it has not been fixed.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: polyglot-reference
spec:
  selector: { app: notifications }
  ports:
    - port: 8080
      targetPort: 8080
