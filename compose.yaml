# Everything the three services need, and nothing they do not.
#
# `docker compose up` is the whole setup story. Every image is pinned to an
# exact version rather than a moving tag: a reference architecture that behaves
# differently depending on the day you cloned it is not a reference.
#
# Health checks are here so `depends_on` can wait for readiness rather than for
# a container to exist. Kafka in particular accepts connections well before it
# will accept a produce, and a service that starts into that window fails in a
# way that looks like a bug in the service.

name: polyglot-reference

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Mounted at /var/lib/postgresql, not .../data. Postgres 18 stores data in a
    # major-version subdirectory so `pg_upgrade --link` can work across it, and
    # it refuses to start if it finds a volume mounted at the old path.
    volumes:
      - postgres-data:/var/lib/postgresql

  # KRaft, so no Zookeeper. Two listeners on purpose: services inside the
  # network reach the broker as `kafka:9092`, and anything on the host — a test,
  # a console consumer — uses `localhost:29092`. One listener cannot serve both,
  # because the advertised address has to be resolvable by the client.
  kafka:
    image: apache/kafka:4.3.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker, so nothing can be replicated anywhere. Left at the default
      # of 3 the internal topics never create and the broker looks healthy while
      # refusing every consumer group.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Jaeger v2: one binary, OTLP in on 4317/4318, UI on 16686. The v1
  # all-in-one image is a different name and a different configuration model;
  # this is not that.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686"
    # Asks the query service for a page rather than asking whether a binary
    # exists on disk. The v1 image's binary path does not exist in v2 anyway,
    # and "the process started" was never the question — services will post
    # spans here and lose them silently if it is not serving yet.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:16686/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Everything's telemetry goes here, and only here. See ops/otel/collector.yaml.
  otel-collector:
    image: otel/opentelemetry-collector:0.140.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.9.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger

  # ---- the services themselves ----------------------------------------------
  #
  # Each waits for what it needs to be *healthy*, not merely started. Kafka in
  # particular accepts connections well before it accepts a produce, and a
  # service that starts into that window fails in a way that reads like a bug in
  # the service.

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders
      Kafka__BootstrapServers: kafka:9092
      Otlp__Endpoint: http://otel-collector:4317
      # See the comment in Program.cs. On here because this file is the one
      # place where a single instance starting once is guaranteed.
      Migrations__ApplyOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  notifications:
    build:
      context: services/notifications
    ports:
      - "8082:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    # The way in. Everything else is exposed for looking at, not for calling.
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Otlp__Endpoint: http://otel-collector:4317
      ReverseProxy__Clusters__orders__Destinations__primary__Address: http://orders:8080/
      ReverseProxy__Clusters__orders__Destinations__primary__Health: http://orders:8080/health
    depends_on:
      orders:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
