spring:
  application:
    name: notifications

  kafka:
    # No default. A consumer pointed at a broker nobody meant to point it at
    # joins a consumer group and starts taking messages off it.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notifications
      # Earliest, so a service started after the producer still sees what it
      # missed. For notifications that is right; for a consumer whose backlog
      # would mean thousands of stale emails it would not be.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Turns each consumed record into a Micrometer observation, which is what
      # reads the `traceparent` header and continues the producer's trace. Off
      # by default: without it the consumer is instrumented and every message
      # still starts a brand new trace.
      observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

management:
  tracing:
    sampling:
      # Everything. This is a reference architecture whose claim is that one
      # request produces one trace; sampling would make that true only
      # sometimes, which is the same as not being able to show it.
      probability: 1.0

  # The current property path. `management.otlp.tracing.endpoint` also exists and
  # is the Boot 3 spelling, kept for compatibility — using it here left the
  # tracer running and exporting nowhere, with no error to say so.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/traces

  # Both signals to the collector, which decides where each ends up. Pointing
  # metrics at a trace backend was the earlier mistake: Jaeger answered 404 once
  # a minute and the metrics went nowhere.
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT}/v1/metrics

  endpoints:
    web:
      exposure:
        # No prometheus endpoint. Metrics leave over OTLP like everything else,
        # and the collector is what Prometheus scrapes — so this service does
        # not need a second, Spring-shaped way out that the .NET services have
        # no equivalent of.
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080
